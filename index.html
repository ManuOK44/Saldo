:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;--bg:#0b1120;--surface:#141e30;--surface2:#1d2a40;--txt:#f3f6ff;--muted:#9daac0;--line:#2b3951;--blue:#5278fa;--green:#5bd7a4;--red:#ff8190}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);padding:env(safe-area-inset-top) 0 calc(90px + env(safe-area-inset-bottom));min-height:100vh}body.light{color-scheme:light;--bg:#f2f5fb;--surface:white;--surface2:#e8edf8;--txt:#172238;--muted:#66758c;--line:#d8e0ed;--green:#087a5b;--red:#c93952}button,input,select,textarea{font:inherit}button{cursor:pointer}header{max-width:760px;margin:auto;padding:20px 18px 12px;display:flex;align-items:center;justify-content:space-between}.logo{display:flex;gap:11px;align-items:center;font-size:24px;font-weight:800;letter-spacing:-1px}.mark{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(140deg,#4064f8,#8c6cff);color:white;font-weight:900}.topactions{display:flex;gap:7px}.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--txt);border-radius:12px;width:42px;height:42px}.wrap{max-width:760px;margin:auto;padding:0 16px}h2{font-size:18px;margin:22px 0 12px;letter-spacing:-.3px}h3{margin:0;font-size:16px}.muted,small{color:var(--muted)}small{font-size:12px}.hero{border-radius:23px;padding:24px;background:linear-gradient(135deg,#244aca,#6a50df);color:#fff;box-shadow:0 14px 35px #0711272d}.hero .muted{color:#d9e5ff}.hero strong{font-size:34px;display:block;margin:7px 0 22px;word-break:break-all}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric,.panel{border:1px solid var(--line);background:var(--surface);border-radius:17px;padding:16px}.metric b{display:block;margin-top:8px;font-size:21px}.line{height:1px;background:var(--line);margin:12px 0}.between{display:flex;justify-content:space-between;align-items:center;gap:12px}.stack{display:grid;gap:10px}.btn{background:var(--blue);border:0;border-radius:12px;color:#fff;padding:13px 16px;font-weight:700}.btn.secondary{background:var(--surface2);color:var(--txt)}.btn.danger{background:#aa3449;color:#fff}.btn.slim{padding:9px 12px;font-size:13px}.pill{border-radius:30px;background:var(--surface2);padding:6px 10px;color:var(--muted);font-size:12px}.cardscroll{display:flex;overflow-x:auto;gap:14px;scroll-snap-type:x mandatory;padding:4px 2px 18px;scrollbar-width:none}.bankcard{min-width:min(87vw,350px);min-height:211px;scroll-snap-align:center;border-radius:22px;padding:23px;color:white;display:flex;flex-direction:column;justify-content:space-between;text-align:left;border:1px solid #ffffff25;box-shadow:0 12px 25px #0002}.bankcard .bank{font-size:24px;font-weight:900}.bankcard b{font-size:28px}.bankcard small{color:#ffffffd4}.minirow{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.minirow:last-child{border:0}.grow{flex:1;min-width:0}.smalltxt{font-size:12px;color:var(--muted)}nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:9px 8px calc(9px + env(safe-area-inset-bottom))}nav button{max-width:150px;flex:1;background:none;border:0;color:var(--muted);display:grid;gap:4px;justify-items:center;padding:7px;border-radius:12px;font-size:12px}nav button.active{background:var(--surface2);color:var(--blue);font-weight:750}nav button span{font-size:21px}dialog{border:1px solid var(--line);background:var(--surface);color:var(--txt);border-radius:24px;padding:0;width:min(95vw,510px);max-height:85vh;overflow:auto;box-shadow:0 25px 80px #0008}dialog::backdrop{background:#0009}.modalhead{position:sticky;top:0;background:var(--surface);padding:18px 20px;border-bottom:1px solid var(--line);z-index:1}.modalbody{padding:18px 20px 22px}.fields{display:grid;gap:12px}.field{display:grid;gap:5px;font-size:13px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--txt);padding:12px;min-height:43px}input[type=checkbox]{width:auto;min-height:auto}.flex{display:flex;gap:10px;align-items:center}.hidden{display:none!important}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions>*{flex:1}.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}.tag{font-size:11px;border-radius:8px;padding:5px 7px;background:var(--surface2)}.categorybar{height:9px;border-radius:5px;background:var(--surface2);overflow:hidden}.categorybar>div{height:100%;background:#6e83f8} .eyebrow{font-size:12px;color:var(--muted);letter-spacing:.2px}.footnote{margin:20px 0;color:var(--muted);font-size:12px;line-height:1.6}button:disabled{opacity:.4;cursor:not-allowed}@media(min-width:600px){.wrap{padding:0 24px}.bankcard{min-width:350px}}@media(max-width:380px){.hero strong{font-size:29px}.metric b{font-size:18px}}
</style></head><body><header><div class="logo"><span class="mark">S</span><span>Saldo</span></div><div class="topactions"><button class="iconbtn" id="eye" title="Ocultar cantidades">◉</button><button class="iconbtn" id="theme" title="Cambiar apariencia">☾</button><button class="iconbtn" id="settings" title="Ajustes">⚙</button></div></header><main id="app" class="wrap"></main><nav id="nav"><button data-tab="home" class="active"><span>▦</span>Resumen</button><button data-tab="credit"><span>▤</span>Crédito</button><button data-tab="debit"><span>▥</span>Débito</button><button data-tab="analysis"><span>◫</span>Análisis</button></nav><dialog id="modal"><div class="modalhead between"><h3 id="modalTitle">Nuevo</h3><button class="iconbtn" id="closeModal" aria-label="Cerrar">✕</button></div><div class="modalbody" id="modalBody"></div></dialog><script>
(()=>{'use strict';const KEY='saldo-v1-data',VIEW='saldo-v1-ui';const $=s=>document.querySelector(s), el=id=>document.getElementById(id);const fresh=()=>({version:1,accounts:[],transactions:[],scheduled:[],installmentPlans:[]});let data;try{data=JSON.parse(localStorage.getItem(KEY))||fresh();if(!Array.isArray(data.accounts)||!Array.isArray(data.transactions)||!Array.isArray(data.scheduled))throw Error('Formato incorrecto')}catch(e){data=fresh();alert('No se pudieron leer los datos guardados. Antes de guardar información nueva, revisa si tienes un respaldo.')};if(!Array.isArray(data.installmentPlans))data.installmentPlans=[];let prefs={tab:'home',dark:true,visible:true};try{prefs={...prefs,...JSON.parse(localStorage.getItem(VIEW)||'{}')}}catch{};let selection=null;const money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(n||0),privacy=n=>prefs.visible?money(n):'••••••';const date=()=>new Date().toLocaleDateString('en-CA'),stamp=()=>new Date().toISOString(),uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const n=v=>Math.round((Number(v)||0)*100)/100;const sum=a=>a.reduce((t,v)=>t+n(v),0);function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function account(id){return data.accounts.find(a=>a.id===id)}function adjust(tx){let a=account(tx.accountId);if(!a)return 0;if(tx.kind==='income')return tx.amount;if(tx.kind==='expense'||tx.kind==='transfer_out'||tx.kind==='credit_payment_out')return -tx.amount;if(tx.kind==='transfer_in')return tx.amount;if(tx.kind==='credit_purchase')return tx.amount;if(tx.kind==='credit_payment_in')return -tx.amount;return 0}function balance(a){return n(a.opening+sum(data.transactions.filter(t=>t.accountId===a.id).map(adjust)))}function totals(){let assets=data.accounts.filter(a=>a.type!=='credit').reduce((s,a)=>s+balance(a),0);let debt=data.accounts.filter(a=>a.type==='credit').reduce((s,a)=>s+balance(a),0);return{assets:n(assets),debt:n(debt),net:n(assets-debt)}}function bankColor(a){return a.color||({BBVA:'#154ba5',Banamex:'#c32942',Plata:'#424251','Mercado Pago':'#218dc2',DiDi:'#ec672d',Nu:'#6b35a4'}[a.bank]||'#4053a6')}function bankCard(a){let b=balance(a);return `<button class="bankcard" data-open="${esc(a.id)}" style="background:linear-gradient(140deg,${bankColor(a)},#101b36)"><div class="between"><span class="bank">${esc(a.bank||a.name)}</span><span style="font-size:24px">◈</span></div><div><small>${a.type==='credit'?'Deuda pendiente':a.type==='cash'?'Efectivo disponible':'Saldo disponible'}</small><b>${privacy(b)}</b></div><div class="between"><small>${esc(a.name)}</small><small>${a.type==='credit'?`Límite ${privacy(a.limit||0)}`:a.type==='cash'?'Cartera':'Cuenta de débito'}</small></div></button>`}function row(t){let a=account(t.accountId),signed=adjust(t);return `<div class="minirow"><span style="font-size:23px">${t.kind==='income'?'↙':t.kind==='credit_purchase'?'▣':t.kind.includes('transfer')?'⇄':t.kind.includes('payment')?'✓':'↗'}</span><div class="grow"><b>${esc(t.note||kindTitle(t.kind))}</b><div class="smalltxt">${esc(a?.name||'Cuenta eliminada')} · ${esc(t.date||'')}</div></div><div style="text-align:right"><b style="color:${signed>0?'var(--green)':'var(--txt)'}">${signed>0?'+':''}${privacy(signed)}</b><div><button class="btn slim secondary" data-edit-tx="${esc(t.groupId||t.id)}">Editar</button></div></div></div>`}function kindTitle(k){return({income:'Ingreso',expense:'Gasto',credit_purchase:'Compra a crédito',credit_payment_in:'Pago de crédito',credit_payment_out:'Pago desde débito',transfer_in:'Transferencia recibida',transfer_out:'Transferencia enviada'})[k]||'Movimiento'}function txList(arr){return arr.length?arr.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.created||'').localeCompare(a.created||'')).slice(0,60).map(row).join(''):'<div class="empty">Todavía no hay movimientos.</div>'}function accountsBy(type){return data.accounts.filter(a=>a.type===type)}function quickButtons(){return `<div class="actions"><button class="btn" data-action="movement">＋ Movimiento</button><button class="btn secondary" data-action="addaccount">＋ Tarjeta / cuenta</button></div>`}function home(){let t=totals(),recent=data.transactions.filter(x=>!x.kind.endsWith('_out')||x.kind==='expense');return `<section class="hero"><div class="muted">Dinero disponible</div><strong>${privacy(t.assets)}</strong><div class="cols"><div><div class="muted">Deuda total</div><h3>${privacy(t.debt)}</h3></div><div><div class="muted">Dinero después de deudas</div><h3>${privacy(t.net)}</h3></div></div></section><h2>Operaciones</h2>${quickButtons()}<h2>Mis cuentas</h2><div class="cardscroll">${data.accounts.length?data.accounts.map(bankCard).join(''):'<div class="empty">Agrega tu primera tarjeta o cartera de efectivo.</div>'}</div><h2>Pagos próximos</h2><div class="panel">${scheduledList(true)}</div><h2>Movimientos recientes</h2><div class="panel">${txList(recent)}</div>`}function section(type){let arr=type==='credit'?accountsBy('credit'):data.accounts.filter(a=>a.type!=='credit');return `<div class="between"><h2>${type==='credit'?'Tarjetas de crédito':'Débito y efectivo'}</h2><button class="btn slim" data-action="addaccount">＋ Agregar</button></div><div class="cardscroll">${arr.length?arr.map(bankCard).join(''):'<div class="empty">Aquí aparecerán tus cuentas.</div>'}</div>${quickButtons()}<h2>Movimientos</h2><div class="panel">${txList(data.transactions.filter(t=>arr.some(a=>a.id===t.accountId)))}</div>`}function scheduledList(short){let a=data.scheduled.filter(s=>!s.done).sort((x,y)=>x.date.localeCompare(y.date));if(short)a=a.slice(0,4);return a.length?a.map(s=>`<div class="minirow"><div class="grow"><b>${esc(s.note||'Pago pendiente')}</b><div class="smalltxt">${esc(s.date)} · ${esc(account(s.creditId)?.name||'Tarjeta')}</div></div><b>${privacy(s.amount)}</b><button class="btn slim" data-pay-sched="${esc(s.id)}">Pagar</button></div>`).join(''):'<div class="muted">Sin pagos pendientes programados.</div>'}function analysis(){let month=new Date().toLocaleDateString('en-CA').slice(0,7),m=el('monthFilter')?.value||month;let tx=data.transactions.filter(t=>t.date?.startsWith(m)),income=sum(tx.filter(t=>t.kind==='income').map(t=>t.amount)),spend=sum(tx.filter(t=>t.kind==='expense'||t.kind==='credit_purchase').map(t=>t.amount));let grouped={};tx.filter(t=>t.kind==='expense'||t.kind==='credit_purchase').forEach(t=>grouped[t.category||'Otros']=(grouped[t.category||'Otros']||0)+t.amount);let max=Math.max(1,...Object.values(grouped));return `<div class="between"><h2>Análisis mensual</h2><input id="monthFilter" aria-label="Mes" type="month" style="width:150px" value="${esc(m)}"></div><div class="cols"><div class="metric"><small>Ingresos</small><b style="color:var(--green)">${privacy(income)}</b></div><div class="metric"><small>Gastos</small><b>${privacy(spend)}</b></div></div><div class="panel" style="margin-top:12px"><div class="between"><span>Ingresos menos gastos</span><b>${privacy(income-spend)}</b></div></div><h2>Gastos por categoría</h2><div class="panel stack">${Object.keys(grouped).length?Object.entries(grouped).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div><div class="between"><span>${esc(k)}</span><b>${privacy(v)}</b></div><div class="categorybar" style="margin-top:7px"><div style="width:${v/max*100}%"></div></div></div>`).join(''):'<div class="muted">Aún no hay gastos de este mes.</div>'}</div><h2>Pagos programados</h2><div class="panel">${scheduledList(false)}<button class="btn secondary" data-action="schedule" style="margin-top:10px;width:100%">＋ Programar pago</button></div><p class="footnote">Las transferencias y los pagos de tarjetas no se suman nuevamente como ingresos o gastos. Las compras a meses se cuentan una sola vez al registrarlas.</p>`}
function planRemaining(p){return Math.max(0,n(p.amount-n(p.paid||0)))}
function planMonthly(p){return n(p.amount/p.months)}
function planInfo(id){let ps=data.installmentPlans.filter(p=>p.accountId===id),active=ps.filter(p=>planRemaining(p)>0.005);let monthly=sum(active.map(p=>Math.min(planMonthly(p),planRemaining(p))));let remaining=sum(active.map(planRemaining));return {ps,active,monthly,remaining}}
function planRows(id){let t=planInfo(id);return `<div class="panel stack"><div class="cols"><div class="metric"><small>Mensualidades por pagar</small><b>${privacy(t.monthly)}</b></div><div class="metric"><small>Deuda a meses pendiente</small><b>${privacy(t.remaining)}</b></div></div><p class="footnote">Estos importes ya forman parte de la deuda de la tarjeta. Registrar una compra existente no aumenta el saldo.</p>${t.ps.length?t.ps.map(p=>{let left=planRemaining(p),total=p.months,paid=n(p.paid||0),completed=Math.min(total,Math.floor(paid/(p.amount/total)+0.000001));return `<div class="minirow"><div class="grow"><b>${esc(p.note)}</b><div class="smalltxt">${completed} de ${total} mensualidades cubiertas · ${privacy(left)} pendientes</div><div class="smalltxt">${privacy(Math.min(planMonthly(p),left))}/mes</div></div><div class="stack"><button class="btn slim" data-pay-plan="${esc(p.id)}" ${left<=0?'disabled':''}>Pagar</button><button class="btn secondary slim" data-edit-plan="${esc(p.id)}">Editar</button></div></div>`}).join(''):'<span class="muted">Sin compras a meses existentes registradas.</span>'}<button class="btn secondary" style="width:100%" data-add-plan="${esc(id)}">＋ Registrar compra a meses existente</button></div>`}
function planForm(accountId,planId){let old=data.installmentPlans.find(p=>p.id===planId),a=account(accountId);if(!a||a.type!=='credit')return;modal(old?'Editar compra existente':'Registrar compra a meses existente',`<form id="planForm" class="fields"><p class="muted">Solo desglosa una compra que YA está incluida en tu deuda inicial. No se sumará otra vez.</p>${field('Nombre de la compra','note',old?.note||'','text','required maxlength="100"')}${field('Monto original ($)','amount',old?.amount||'','number','required min="0.01" step="0.01"')}${field('Número total de mensualidades','months',old?.months||'','number','required min="2" max="120"')}${field('Mensualidades ya pagadas','paidMonths',old?Math.min(old.months,Math.round(old.paid/(old.amount/old.months))):0,'number','required min="0" max="120"')}<button class="btn">Guardar compra</button>${old?'<button type="button" class="btn danger" id="deletePlan">Eliminar solo este desglose</button>':''}</form>`);el('planForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),amount=n(f.get('amount')),months=Number(f.get('months')),paidMonths=Number(f.get('paidMonths')),note=String(f.get('note')||'').trim();if(!note||amount<=0||!Number.isInteger(months)||months<2||months>120||!Number.isInteger(paidMonths)||paidMonths<0||paidMonths>months)return alert('Revisa el nombre, monto y mensualidades.');let paid=n(amount*paidMonths/months);if(old){Object.assign(old,{note,amount,months,paid})}else{data.installmentPlans.push({id:uid(),accountId,note,amount,months,paid})}el('modal').close();save()};if(old)el('deletePlan').onclick=()=>{if(!confirm('¿Quitar este desglose? No se modificará la deuda de la tarjeta ni se eliminarán pagos reales registrados.'))return;data.installmentPlans=data.installmentPlans.filter(p=>p.id!==old.id);el('modal').close();save()}}
function payPlan(id){let p=data.installmentPlans.find(p=>p.id===id);if(!p)return;let left=planRemaining(p);if(left<=0)return;let amount=Math.min(planMonthly(p),left);modal('Registrar mensualidad pagada',`<form id="payPlanF" class="fields"><p class="muted">Este pago real se descontará de la deuda de la tarjeta solo cuando lo confirmes.</p><p><b>${esc(p.note)}</b> · pendiente: ${privacy(left)}</p>${field('Importe pagado ($)','amount',amount,'number',`required min="0.01" max="${left}" step="0.01"`)}<label class="field">Origen del dinero<select name="source"><option value="">Sin vincular cuenta de débito o efectivo</option>${chooseOptions(data.accounts.filter(a=>a.type!=='credit'))}</select></label><button class="btn">Confirmar pago realizado</button></form>`);el('payPlanF').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),value=n(f.get('amount')),source=String(f.get('source')||'');if(value<=0||value>planRemaining(p)+0.005)return alert('Revisa el importe del pago.');let base={groupId:uid(),amount:value,date:date(),note:'Mensualidad: '+p.note,created:stamp(),planId:p.id};data.transactions.push({...base,id:uid(),accountId:p.accountId,kind:'credit_payment_in'});if(source&&account(source)&&source!==p.accountId)data.transactions.push({...base,id:uid(),accountId:source,kind:'credit_payment_out'});p.paid=n((p.paid||0)+value);el('modal').close();save()}}
function detail(id){let a=account(id);if(!a){selection=null;render();return ''}let b=balance(a),inst=data.transactions.filter(t=>t.accountId===id&&t.kind==='credit_purchase'&&t.installments>1);return `<button class="btn secondary slim" data-action="back">← Volver</button><h2>${esc(a.name)}</h2><div class="cardscroll">${bankCard(a)}</div><div class="cols"><div class="metric"><small>${a.type==='credit'?'Deuda actual':'Saldo actual'}</small><b>${privacy(b)}</b></div><div class="metric"><small>${a.type==='credit'?'Crédito disponible':'Saldo inicial'}</small><b>${privacy(a.type==='credit'?n((a.limit||0)-b):a.opening)}</b></div></div>${a.type==='credit'?`<div class="panel" style="margin-top:12px"><div class="between"><span>Corte: día ${esc(a.cut||'—')}</span><span>Pago: día ${esc(a.due||'—')}</span></div></div>`:''}<div class="actions" style="margin-top:12px"><button class="btn" data-action="movement">＋ Movimiento</button><button class="btn secondary" data-edit-acct="${esc(id)}">Editar cuenta</button></div>${a.type==='credit'?`<h2>Compras a meses</h2>${planRows(id)}<h3>Compras nuevas registradas</h3><div class="panel">${inst.length?inst.map(t=>`<div class="minirow"><div class="grow"><b>${esc(t.note||'Compra')}</b><div class="smalltxt">${t.installments} mensualidades de ${money(t.amount/t.installments)}</div></div><b>${privacy(t.amount)}</b></div>`).join(''):'<span class="muted">Sin compras a meses registradas.</span>'}</div>`:''}<h2>Historial</h2><div class="panel">${txList(data.transactions.filter(t=>t.accountId===id))}</div>`}function render(){document.body.classList.toggle('light',!prefs.dark);el('eye').textContent=prefs.visible?'◉':'◌';el('theme').textContent=prefs.dark?'☼':'☾';el('app').innerHTML=selection?detail(selection):prefs.tab==='home'?home():prefs.tab==='credit'?section('credit'):prefs.tab==='debit'?section('debit'):analysis();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===prefs.tab))}function modal(title,html){el('modalTitle').textContent=title;el('modalBody').innerHTML=html;el('modal').showModal()}const field=(label,name,value='',type='text',more='')=>`<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${more}></label>`;function chooseOptions(arr,selected=''){return arr.map(a=>`<option value="${esc(a.id)}" ${selected===a.id?'selected':''}>${esc(a.name)} (${a.type==='credit'?'Crédito':a.type==='cash'?'Efectivo':'Débito'})</option>`).join('')}function accountForm(id){let a=account(id)||{name:'',bank:'BBVA',type:prefs.tab==='credit'?'credit':'debit',opening:0,limit:0,cut:'',due:'',color:''};modal(id?'Editar cuenta':'Agregar tarjeta o cuenta',`<form id="accountForm" class="fields"><label class="field">Tipo<select name="type"><option value="credit" ${a.type==='credit'?'selected':''}>Crédito</option><option value="debit" ${a.type==='debit'?'selected':''}>Débito</option><option value="cash" ${a.type==='cash'?'selected':''}>Efectivo</option></select></label>${field('Nombre de la cuenta','name',a.name,'text','required maxlength="45"')}<label class="field">Banco<select name="bank">${['BBVA','Banamex','Plata','Mercado Pago','DiDi','Nu','Santander','HSBC','Banorte','Efectivo','Otro'].map(v=>`<option ${a.bank===v?'selected':''}>${v}</option>`).join('')}</select></label>${field('Saldo o deuda inicial ($)','opening',a.opening,'number','required step="0.01"')}${field('Límite de crédito ($, solo crédito)','limit',a.limit||0,'number','min="0" step="0.01"')}${field('Día de corte (solo crédito)','cut',a.cut||'','number','min="1" max="31"')}${field('Día límite de pago (solo crédito)','due',a.due||'','number','min="1" max="31"')}<button class="btn" type="submit">Guardar cuenta</button>${id?'<button type="button" class="btn danger" id="deleteAcct">Eliminar cuenta y sus movimientos</button>':''}</form>`);el('accountForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),type=f.get('type');let obj={...a,id:id||uid(),type,name:String(f.get('name')).trim(),bank:String(f.get('bank')),opening:n(f.get('opening')),limit:n(f.get('limit')),cut:String(f.get('cut')||''),due:String(f.get('due')||'')};if(!obj.name)return;if(type==='credit'&&obj.opening<0)return alert('La deuda inicial no puede ser negativa.');if(id)data.accounts=data.accounts.map(x=>x.id===id?obj:x);else data.accounts.push(obj);el('modal').close();save()};if(id)el('deleteAcct').onclick=()=>{if(!confirm('¿Eliminar esta cuenta y TODOS sus movimientos asociados? Esta acción no se puede deshacer.'))return;let gids=new Set(data.transactions.filter(t=>t.accountId===id).map(t=>t.groupId).filter(Boolean));data.transactions=data.transactions.filter(t=>t.accountId!==id&&!gids.has(t.groupId));data.accounts=data.accounts.filter(a=>a.id!==id);data.scheduled=data.scheduled.filter(s=>s.creditId!==id&&s.sourceId!==id);data.installmentPlans=data.installmentPlans.filter(p=>p.accountId!==id);selection=null;el('modal').close();save()}}function movementForm(){if(!data.accounts.length)return accountForm();modal('Registrar movimiento',`<form id="moveForm" class="fields"><label class="field">Operación<select name="op" id="op"><option value="expense">Gasto desde débito o efectivo</option><option value="income">Ingreso</option><option value="credit_purchase">Compra con crédito</option><option value="credit_payment">Pago de tarjeta de crédito</option><option value="transfer">Transferencia entre cuentas</option></select></label><label class="field">Cuenta principal<select name="source" id="source"></select></label><label class="field" id="targetField">Cuenta destino<select name="target" id="target"></select></label>${field('Cantidad ($)','amount','','number','min="0.01" step="0.01" required')}${field('Concepto / descripción','note','','text','maxlength="100"')}<label class="field" id="catField">Categoría<select name="category">${['Comida','Gasolina','Compras','Servicios','Transporte','Salud','Entretenimiento','Sueldo','Ganancias','Ventas','Otros'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field" id="monthsField">Número de meses (1 = compra normal)<input type="number" min="1" max="120" value="1" name="installments"></label>${field('Fecha','date',date(),'date','required')}<button class="btn">Guardar movimiento</button></form>`);function refresh(){let op=el('op').value,from=op==='credit_purchase'?accountsBy('credit'):op==='credit_payment'?data.accounts.filter(a=>a.type!=='credit'):op==='expense'||op==='income'?data.accounts.filter(a=>a.type!=='credit'):data.accounts.filter(a=>a.type!=='credit');let to=op==='credit_payment'?accountsBy('credit'):op==='transfer'?data.accounts.filter(a=>a.type!=='credit'):[];el('source').innerHTML=chooseOptions(from,selection||'');el('target').innerHTML=chooseOptions(to);el('targetField').classList.toggle('hidden',!['transfer','credit_payment'].includes(op));el('monthsField').classList.toggle('hidden',op!=='credit_purchase');el('catField').classList.toggle('hidden',!['income','expense','credit_purchase'].includes(op))}el('op').onchange=refresh;refresh();el('moveForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),op=f.get('op'),amount=n(f.get('amount')),source=String(f.get('source')||''),target=String(f.get('target')||''),when=String(f.get('date')),note=String(f.get('note')||'').trim(),category=String(f.get('category')||'Otros'),months=Number(f.get('installments'));if(!(amount>0)||!source||!account(source)||!when)return alert('Revisa la cantidad, cuenta y fecha.');if((op==='transfer'||op==='credit_payment')&&(!target||target===source||!account(target)))return alert('Selecciona una cuenta de destino diferente.');if(op==='credit_purchase'&&(!Number.isInteger(months)||months<1||months>120))return alert('Indica mensualidades entre 1 y 120.');let gid=uid(),base={groupId:gid,amount,date:when,note,category,created:stamp()};if(op==='credit_payment'||op==='transfer'){data.transactions.push({...base,id:uid(),accountId:source,kind:op==='credit_payment'?'credit_payment_out':'transfer_out'},{...base,id:uid(),accountId:target,kind:op==='credit_payment'?'credit_payment_in':'transfer_in'});}else data.transactions.push({...base,id:uid(),accountId:source,kind:op,installments:op==='credit_purchase'?months:1});el('modal').close();save()}}function editTx(groupId){let group=data.transactions.filter(t=>(t.groupId||t.id)===groupId);if(!group.length)return;let t=group[0];modal('Movimiento registrado',`<div class="stack"><div class="panel"><b>${esc(t.note||kindTitle(t.kind))}</b><p>${esc(t.date)} · ${privacy(t.amount)}</p><small>${esc(account(t.accountId)?.name||'')}</small></div><p class="muted">Si necesitas corregir este movimiento, elimínalo y vuelve a registrarlo. Los movimientos vinculados se eliminan juntos.</p><button id="delTx" class="btn danger">Eliminar movimiento</button></div>`);el('delTx').onclick=()=>{if(!confirm('¿Eliminar este movimiento?'))return;data.transactions=data.transactions.filter(x=>(x.groupId||x.id)!==groupId);if(t.planId){let p=data.installmentPlans.find(p=>p.id===t.planId);if(p)p.paid=Math.max(0,n((p.paid||0)-t.amount))}el('modal').close();save()}}function scheduleForm(){if(!accountsBy('credit').length)return alert('Primero agrega una tarjeta de crédito.');modal('Programar pago',`<form id="scheduleForm" class="fields"><label class="field">Tarjeta a pagar<select name="creditId">${chooseOptions(accountsBy('credit'))}</select></label><label class="field">Origen del dinero<select name="sourceId"><option value="">Registrar pago sin vincular cuenta</option>${chooseOptions(data.accounts.filter(a=>a.type!=='credit'))}</select></label>${field('Importe ($)','amount','','number','min="0.01" step="0.01" required')}${field('Fecha límite','date',date(),'date','required')}${field('Descripción','note','Pago programado')}<button class="btn">Programar</button></form>`);el('scheduleForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),obj={id:uid(),creditId:f.get('creditId'),sourceId:f.get('sourceId'),amount:n(f.get('amount')),date:f.get('date'),note:f.get('note'),done:false};if(obj.amount<=0)return;data.scheduled.push(obj);el('modal').close();save()}}function payScheduled(id){let s=data.scheduled.find(x=>x.id===id);if(!s||s.done)return;modal('Confirmar pago',`<div class="stack"><p>Se registrará un pago de <b>${money(s.amount)}</b> a ${esc(account(s.creditId)?.name||'tarjeta')}. Si elegiste una cuenta de origen, también se descontará de ella.</p><button class="btn" id="confirmPay">Confirmar pago realizado</button></div>`);el('confirmPay').onclick=()=>{let base={groupId:uid(),amount:s.amount,date:date(),note:s.note||'Pago programado',created:stamp()};data.transactions.push({...base,id:uid(),accountId:s.creditId,kind:'credit_payment_in'});if(s.sourceId&&account(s.sourceId))data.transactions.push({...base,id:uid(),accountId:s.sourceId,kind:'credit_payment_out'});s.done=true;el('modal').close();save()}}function settings(){modal('Configuración y respaldos',`<div class="stack"><p class="muted">Tus datos se guardan solamente en este dispositivo. Exporta un respaldo periódicamente: borrar datos de Safari, reinstalar o cambiar de teléfono podría eliminarlos.</p><button class="btn" id="export">Exportar respaldo (.json)</button><label class="field">Importar respaldo (.json)<input id="import" type="file" accept="application/json,.json"></label><button class="btn secondary" id="toggleMode">Cambiar a modo ${prefs.dark?'claro':'oscuro'}</button><p class="footnote">Saldo es un registro personal manual; no consulta bancos ni mueve dinero real. No guardes números completos de tarjeta, NIP ni contraseñas.</p></div>`);el('export').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='saldo-respaldo-'+date()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};el('import').onchange=async e=>{let file=e.target.files?.[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!Array.isArray(obj.accounts)||!Array.isArray(obj.transactions)||!Array.isArray(obj.scheduled))throw Error('Formato inválido');if(!confirm('Esto reemplazará todos los datos actuales. ¿Continuar?'))return;data=obj;selection=null;el('modal').close();save()}catch(err){alert('No se pudo importar: '+err.message)}};el('toggleMode').onclick=()=>{prefs.dark=!prefs.dark;localStorage.setItem(VIEW,JSON.stringify(prefs));el('modal').close();render()}}document.addEventListener('click',e=>{let b=e.target.closest('[data-tab],[data-open],[data-action],[data-edit-acct],[data-edit-tx],[data-pay-sched],[data-add-plan],[data-pay-plan],[data-edit-plan]');if(!b)return;if(b.dataset.tab){prefs.tab=b.dataset.tab;selection=null;localStorage.setItem(VIEW,JSON.stringify(prefs));render()}if(b.dataset.open){selection=b.dataset.open;render()}if(b.dataset.editAcct)accountForm(b.dataset.editAcct);if(b.dataset.editTx)editTx(b.dataset.editTx);if(b.dataset.paySched)payScheduled(b.dataset.paySched);if(b.dataset.addPlan)planForm(b.dataset.addPlan);if(b.dataset.payPlan)payPlan(b.dataset.payPlan);if(b.dataset.editPlan){let p=data.installmentPlans.find(p=>p.id===b.dataset.editPlan);if(p)planForm(p.accountId,p.id)}if(b.dataset.action){({movement:movementForm,addaccount:()=>accountForm(),schedule:scheduleForm,back:()=>{selection=null;render()}})[b.dataset.action]?.()}});el('closeModal').onclick=()=>el('modal').close();el('eye').onclick=()=>{prefs.visible=!prefs.visible;localStorage.setItem(VIEW,JSON.stringify(prefs));render()};el('theme').onclick=()=>{prefs.dark=!prefs.dark;localStorage.setItem(VIEW,JSON.stringify(prefs));render()};el('settings').onclick=settings;document.addEventListener('change',e=>{if(e.target.id==='monthFilter'){let v=e.target.value;render();el('monthFilter').value=v;let tx=data.transactions.filter(t=>t.date?.startsWith(v));let incomes=sum(tx.filter(t=>t.kind==='income').map(t=>t.amount));let expenses=sum(tx.filter(t=>t.kind==='expense'||t.kind==='credit_purchase').map(t=>t.amount));let grouped={};tx.filter(t=>['expense','credit_purchase'].includes(t.kind)).forEach(t=>grouped[t.category||'Otros']=(grouped[t.category||'Otros']||0)+t.amount);el('app').innerHTML=analysisForMonth(v,incomes,expenses,grouped)}});function analysisForMonth(m,inc,exp,grouped){let max=Math.max(1,...Object.values(grouped));return `<div class="between"><h2>Análisis mensual</h2><input id="monthFilter" type="month" style="width:150px" value="${esc(m)}"></div><div class="cols"><div class="metric"><small>Ingresos</small><b style="color:var(--green)">${privacy(inc)}</b></div><div class="metric"><small>Gastos</small><b>${privacy(exp)}</b></div></div><div class="panel" style="margin-top:12px"><div class="between"><span>Ingresos menos gastos</span><b>${privacy(inc-exp)}</b></div></div><h2>Gastos por categoría</h2><div class="panel stack">${Object.keys(grouped).length?Object.entries(grouped).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div><div class="between"><span>${esc(k)}</span><b>${privacy(v)}</b></div><div class="categorybar" style="margin-top:7px"><div style="width:${v/max*100}%"></div></div></div>`).join(''):'<div class="muted">Sin gastos.</div>'}</div><h2>Pagos programados</h2><div class="panel">${scheduledList(false)}<button class="btn secondary" data-action="schedule" style="margin-top:10px;width:100%">＋ Programar pago</button></div>`}render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));})();
</script></body></html>
